<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .wrapper { width: 100%; table-layout: fixed; background-color: #f4f7f6; padding-bottom: 40px; padding-top: 40px; }
        .card { max-width: 560px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); padding: 32px; text-align: center; color: #ffffff; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .content { padding: 40px 32px; color: #334155; line-height: 1.6; }
        .greeting { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #1e293b; }
        .text { font-size: 15px; margin-bottom: 24px; color: #64748b; }
        .code-container { background-color: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 8px; padding: 20px; text-align: center; margin: 30px 0; }
        .code { font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 700; letter-spacing: 6px; color: #4f46e5; margin: 0; }
        .footer { background-color: #f8fafc; padding: 24px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="header">
                <h1>Verify Your Account</h1>
            </div>
            <div class="content">
                <div class="greeting">Hello, {{.Name}}!</div>
                <div class="text">{{.Content}}</div>
                
                <div class="code-container">
                    <div class="code">{{.Code}}</div>
                </div>
                
                <div class="text" style="font-size: 13px; text-align: center; margin-bottom: 0;">
                    If you didn't request this, you can safely ignore this email.
                </div>
            </div>
            <div class="footer">
                    &copy; <a href="https://vyninx.com" target="_blank">Vyninx</a>. All rights reserved.
                </div>
        </div>
    </div>
</body>
</html>
